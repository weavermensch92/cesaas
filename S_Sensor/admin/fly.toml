# Fly.io — @hd/sensor-admin
# 위치: 모노레포 루트(hd-hyundai-poc/)에서 `flyctl deploy --config S_Sensor/admin/fly.toml` 로 배포.
#
# 사전:
#   flyctl auth login
#   flyctl apps create hd-poc-admin --org gridge
#   flyctl secrets set --app hd-poc-admin \
#     NEXT_PUBLIC_SUPABASE_URL=... \
#     NEXT_PUBLIC_SUPABASE_ANON_KEY=... \
#     NEXT_PUBLIC_API_BASE=... \
#     NEXT_PUBLIC_SITE_URL=https://hd-poc-admin.fly.dev

app = "hd-poc-admin"
primary_region = "nrt"   # Tokyo — 러시아 도달성 검증된 위치 (C_01)

[build]
  dockerfile = "S_Sensor/admin/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
