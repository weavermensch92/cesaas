# Supabase 프로젝트 설정 — HD건설기계 PoC
# 참조: C_01_Hosting.md (Tokyo · ap-northeast-1)

project_id = "hd-poc"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# 로컬 dev 전용 — 원격 운영 URL은 Supabase Dashboard 또는 Management API로 관리 (013 마이그레이션 이후 hd-poc-admin.fly.dev).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "https://hd-poc-admin.fly.dev/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.normalize-worker]
verify_jwt = false

[functions.captures-chunks]
verify_jwt = false

[functions.captures-finalize]
verify_jwt = false

[functions.responses-receive]
verify_jwt = false

# Admin 함수는 자체 admin_auth (Supabase Bearer + 도메인 화이트리스트) 로 검증
[functions.admin-captures]
verify_jwt = false

[functions.admin-clusters]
verify_jwt = false

[functions.admin-field-edit]
verify_jwt = false

[functions.admin-normalize-trigger]
verify_jwt = false

# V_30 Voice Admin — Supabase Bearer (admin_auth)
[functions.voice-responses]
verify_jwt = false

[functions.voice-aggregates]
verify_jwt = false

[functions.voice-csv-export]
verify_jwt = false

# V_60 Studio — gridge_admin role 검증 (admin_auth + 함수 내부 role check)
[functions.studio-build-survey]
verify_jwt = false

[functions.studio-deploy]
verify_jwt = false

# U_Unified — Lead 목록·상세 (admin_auth)
[functions.admin-leads]
verify_jwt = false

[functions.admin-leads-detail]
verify_jwt = false

# T_08 — 통과 판정 (정량 9 지표 집계)
[functions.admin-test-summary]
verify_jwt = false
