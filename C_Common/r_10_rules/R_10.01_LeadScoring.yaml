# R_10.01 — LeadScoring
# Voice 응답 + Sensor 활동 + CRM 데이터를 종합한 0~100 점수.
# 코드 외부 룰. R_20.01 RuleEditor → R_20.02 Validation → R_20.03 Deployment 사이클로 정정.
# 로드: harness2/lib loadRules('R_10.01_LeadScoring').
#
# 시드 4 규칙 (v1). 정밀도는 외부 컨트롤 사이클로 끌어올림 (H_외부컨트롤).
#
# 주의: 004_unified.sql의 score_lead() plpgsql은 v0.1의 weights 스냅샷 — Phase D에서
# 이 YAML 기반 Edge Function 호출로 교체 예정. 그 전까지 양쪽이 약간 다른 점수를 낼 수 있음.

rule_id: R_10.01_LeadScoring
version: 1
description: '리드 점수 산출 (0~100). Voice 응답·Sensor 활동·CRM 데이터 종합.'
harness: 2
v1_v2: v1
status: active
last_modified: '2026-05-19T00:00:00Z'
modified_by: 'weaver@gridge.co.kr'

input_schema:
  response:
    nps: int                    # 0~10
    future_subscription: bool   # 향후 수신 동의
  lead:
    segment: string             # 'mining' / 'key_account' / 'general' / 'other'
    sensor_activity_count: int  # 7 화면 누적 캡쳐 수
    deal_amount_rub: int        # 거래액 (RUB)
    region: string              # 'ru' / 'kr'

rules:
  - id: R_10.01.001_nps_high
    description: 'NPS ≥ 9 → 충성도 높음'
    condition: 'response.nps >= 9'
    action: 'score += 30'
    severity: SHOULD

  - id: R_10.01.002_high_value_segment_with_activity
    description: 'Mining 또는 Key Account + Sensor 활동 5건 이상'
    condition: "lead.segment in ['mining', 'key_account'] AND lead.sensor_activity_count >= 5"
    action: 'score += 40'
    severity: SHOULD

  - id: R_10.01.003_future_subscription
    description: '후속 영업 옵트인'
    condition: 'response.future_subscription == true'
    action: 'score += 20'
    severity: SHOULD

  - id: R_10.01.004_high_deal_amount
    description: '거래액 5M₽ 이상'
    condition: 'lead.deal_amount_rub >= 5000000'
    action: 'score += 30'
    severity: SHOULD

output:
  type: int
  clamp_min: 0
  clamp_max: 100
  default: 0
