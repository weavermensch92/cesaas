# PR 마다 시크릿 패턴 grep — PUBLIC repo 보호.
# 실 시크릿 형태만 매치. placeholder/example 명령(sk-ant-xxxxx, __KEY__, ...) 통과.
name: Audit secrets

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for likely secrets
        run: |
          # 실 키 형식만 매치. placeholder 통과.
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'                                              # AWS access key
            'aws_secret_access_key[[:space:]]*=[[:space:]]*[A-Za-z0-9/+]{40}'
            'sk-ant-api[0-9]+-[A-Za-z0-9_-]{60,}'                            # Anthropic 실 키
            'sk_live_[A-Za-z0-9]{24,}'                                       # Stripe live
            'eyJhbGci[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{50,}\.[A-Za-z0-9_-]{20,}'  # 실 JWT (3-segment)
            'ghp_[A-Za-z0-9]{36,}'                                           # GitHub PAT
            'fly_[a-zA-Z0-9_]{40,}'                                          # Fly.io token
            'VOICE_JWT_SECRET[[:space:]]*=[[:space:]]*[A-Fa-f0-9]{64}'       # 32-byte hex
            'SENSOR_HMAC_SECRET[[:space:]]*=[[:space:]]*[A-Fa-f0-9]{64}'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            HITS=$(git ls-files -z | xargs -0 grep -lE "$p" 2>/dev/null \
              | grep -vE '(node_modules/|\.env\.example$|audit-secrets\.yml$|package-lock\.json$)' || true)
            if [ -n "$HITS" ]; then
              echo "::error::pattern '$p' matched in:"; echo "$HITS"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::시크릿 의심 패턴 발견. 해당 파일을 .env.local 로 이전 + .gitignore 추가."
            exit 1
          fi
          echo "✓ no secret patterns detected (PASS)"
