# PR 마다 시크릿 패턴 grep — PUBLIC repo 보호.
name: Audit secrets

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for likely secrets
        run: |
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'                  # AWS access key
            'aws_secret_access_key'
            'sk-ant-[a-zA-Z0-9_-]{20,}'         # Anthropic
            'sk_live_'                           # Stripe live
            'eyJ[A-Za-z0-9_-]{20,}\.eyJ'        # JWT body (loose)
            'ANTHROPIC_API_KEY[[:space:]]*=[[:space:]]*sk-'
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9]'
            'VOICE_JWT_SECRET[[:space:]]*=[[:space:]]*[A-Za-z0-9]'
            'SENSOR_HMAC_SECRET[[:space:]]*=[[:space:]]*[A-Fa-f0-9]{16,}'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            # node_modules, .env.example, audit workflow 자체는 제외
            HITS=$(git ls-files | xargs -I{} grep -lE "$p" "{}" 2>/dev/null \
              | grep -vE '(node_modules|\.env\.example|audit-secrets\.yml|SECURITY\.md)' || true)
            if [ -n "$HITS" ]; then
              echo "::error::pattern '$p' matched in:"; echo "$HITS"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "✓ no secret patterns detected"
