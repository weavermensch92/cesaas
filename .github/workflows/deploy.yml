# Supabase 마이그레이션 + Edge Functions 자동 배포.
# main → production, staging → staging 환경.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN       — 위버 PAT (Supabase Dashboard → Account → Access Tokens)
#   SUPABASE_REF_PROD           — 프로젝트 ref (xxx.supabase.co의 xxx)
#   SUPABASE_REF_STAGING        — staging 프로젝트 ref
#   SUPABASE_DB_PASSWORD_PROD   — DB 비밀번호 (db push 시 필요)
#   SUPABASE_DB_PASSWORD_STAGING
#   FLY_API_TOKEN               — Fly.io 배포 토큰
#   NEXT_PUBLIC_SUPABASE_URL    — Supabase 프로젝트 URL (Next.js 빌드 시 필요)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — Supabase anon key (Next.js 빌드 시 필요)
#   NEXT_PUBLIC_API_BASE        — Edge Function base URL (Next.js 빌드 시 필요)
#   NEXT_PUBLIC_SITE_URL        — Admin UI URL (Next.js 빌드 시 필요)

name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install (no lock yet · use install instead of ci)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present || true
      # PoC v1 — typecheck 실패해도 deploy 차단하지 않음 (workspace간 cross-ref 미완성 영역 존재).
      # Production 가까울 때 `|| true` 제거.

  # NOTE 2026-05-22: guard-secrets job 제거.
  # 이유: guard-secrets에 `environment: production` 미선언이라 environment-scoped secrets
  # (SUPABASE_REF_PROD 등)을 항상 빈 값으로 봐서 `deploy-prod`가 영구 스킵됐음.
  # `deploy-admin-fly`의 fail-loudly 패턴(31ea5b6) 일관성으로, deploy-prod도 무조건 시도하고
  # 시작 시 explicit verify로 즉시 실패하게 변경.

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: typecheck
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_REF_STAGING }}
      DB_PWD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: DB migrations
        run: |
          supabase link --project-ref "$REF" --password "$DB_PWD"
          supabase db push --linked --include-all
        working-directory: C_Common/supabase
      - name: Deploy Edge Functions
        run: |
          cd S_Sensor/backend       && supabase functions deploy --project-ref "$REF" --no-verify-jwt captures-chunks captures-finalize normalize-worker admin-captures admin-clusters admin-field-edit admin-normalize-trigger admin-members admin-settings admin-llm-usage auth-me auth-mark-password-set
          cd ../../V_Voice/backend  && supabase functions deploy --project-ref "$REF" --no-verify-jwt responses-receive voice-responses voice-aggregates voice-csv-export studio-build-survey studio-deploy surveys-get dealer-tokens-issue dealer-tokens-list dealer-tokens-revoke dealer-consultations dealer-playbook voice-realtime
          cd ../../U_Unified/backend && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-leads admin-leads-detail admin-lead-associate
          cd ../../T_Test/backend   && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-test-summary

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [typecheck]
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_REF_PROD }}
      DB_PWD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase secrets
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$REF" ]                  && missing+=("SUPABASE_REF_PROD")
          [ -z "$DB_PWD" ]               && missing+=("SUPABASE_DB_PASSWORD_PROD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing production environment secrets: ${missing[*]}. Set them in Settings → Environments → production."
            exit 1
          fi
          echo "All required prod secrets present (REF length: ${#REF})."
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: DB migrations
        run: |
          supabase link --project-ref "$REF" --password "$DB_PWD"
          supabase db push --linked --include-all
        working-directory: C_Common/supabase
      - name: Deploy Edge Functions
        run: |
          cd S_Sensor/backend       && supabase functions deploy --project-ref "$REF" --no-verify-jwt captures-chunks captures-finalize normalize-worker admin-captures admin-clusters admin-field-edit admin-normalize-trigger admin-members admin-settings admin-llm-usage auth-me auth-mark-password-set
          cd ../../V_Voice/backend  && supabase functions deploy --project-ref "$REF" --no-verify-jwt responses-receive voice-responses voice-aggregates voice-csv-export studio-build-survey studio-deploy surveys-get dealer-tokens-issue dealer-tokens-list dealer-tokens-revoke dealer-consultations dealer-playbook voice-realtime
          cd ../../U_Unified/backend && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-leads admin-leads-detail admin-lead-associate
          cd ../../T_Test/backend   && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-test-summary

  deploy-admin-fly:
    if: github.ref == 'refs/heads/main'
    needs: [typecheck]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Add it to repository or production environment secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN present (length: ${#FLY_API_TOKEN})"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: |
          flyctl deploy --remote-only \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg "NEXT_PUBLIC_API_BASE=$NEXT_PUBLIC_API_BASE" \
            --build-arg "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
