# Supabase 마이그레이션 + Edge Functions 자동 배포.
# main → production, staging → staging 환경.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN       — 위버 PAT (Supabase Dashboard → Account → Access Tokens)
#   SUPABASE_REF_PROD           — 프로젝트 ref (xxx.supabase.co의 xxx)
#   SUPABASE_REF_STAGING        — staging 프로젝트 ref
#   SUPABASE_DB_PASSWORD_PROD   — DB 비밀번호 (db push 시 필요)
#   SUPABASE_DB_PASSWORD_STAGING

name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install (no lock yet · use install instead of ci)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present || true
      # PoC v1 — typecheck 실패해도 deploy 차단하지 않음 (workspace간 cross-ref 미완성 영역 존재).
      # Production 가까울 때 `|| true` 제거.

  guard-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_prod_secrets: ${{ steps.s.outputs.has_prod }}
      has_fly_token:    ${{ steps.s.outputs.has_fly }}
    steps:
      - id: s
        env:
          REF_PROD: ${{ secrets.SUPABASE_REF_PROD }}
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          [ -n "$REF_PROD"  ] && echo "has_prod=true" >> $GITHUB_OUTPUT || echo "has_prod=false" >> $GITHUB_OUTPUT
          [ -n "$FLY_TOKEN" ] && echo "has_fly=true"  >> $GITHUB_OUTPUT || echo "has_fly=false"  >> $GITHUB_OUTPUT

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: typecheck
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_REF_STAGING }}
      DB_PWD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: DB migrations
        run: |
          supabase link --project-ref "$REF" --password "$DB_PWD"
          supabase db push --linked --include-all
        working-directory: C_Common/supabase
      - name: Deploy Edge Functions
        run: |
          cd S_Sensor/backend       && supabase functions deploy --project-ref "$REF" --no-verify-jwt captures-chunks captures-finalize normalize-worker admin-captures admin-clusters admin-field-edit admin-normalize-trigger
          cd ../../V_Voice/backend  && supabase functions deploy --project-ref "$REF" --no-verify-jwt responses-receive voice-responses voice-aggregates voice-csv-export studio-build-survey studio-deploy surveys-get
          cd ../../U_Unified/backend && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-leads admin-leads-detail
          cd ../../T_Test/backend   && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-test-summary

  deploy-prod:
    if: github.ref == 'refs/heads/main' && needs.guard-secrets.outputs.has_prod_secrets == 'true'
    needs: [typecheck, guard-secrets]
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_REF_PROD }}
      DB_PWD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: DB migrations
        run: |
          supabase link --project-ref "$REF" --password "$DB_PWD"
          supabase db push --linked --include-all
        working-directory: C_Common/supabase
      - name: Deploy Edge Functions
        run: |
          cd S_Sensor/backend       && supabase functions deploy --project-ref "$REF" --no-verify-jwt captures-chunks captures-finalize normalize-worker admin-captures admin-clusters admin-field-edit admin-normalize-trigger
          cd ../../V_Voice/backend  && supabase functions deploy --project-ref "$REF" --no-verify-jwt responses-receive voice-responses voice-aggregates voice-csv-export studio-build-survey studio-deploy surveys-get
          cd ../../U_Unified/backend && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-leads admin-leads-detail
          cd ../../T_Test/backend   && supabase functions deploy --project-ref "$REF" --no-verify-jwt admin-test-summary

  deploy-admin-fly:
    if: github.ref == 'refs/heads/main' && needs.guard-secrets.outputs.has_fly_token == 'true'
    needs: [deploy-prod, guard-secrets]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
